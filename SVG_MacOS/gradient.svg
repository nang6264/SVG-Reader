<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
	<defs>
		<!-- Linear gradient không transform -->
		<linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#ff0000"/>
			<stop offset="50%" stop-color="#00ff00"/>
			<stop offset="100%" stop-color="#0000ff"/>
		</linearGradient>

		<!-- Linear gradient với rotate 45 độ -->
		<linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(45 0.5 0.5)">
			<stop offset="0%" stop-color="#ff0000"/>
			<stop offset="50%" stop-color="#00ff00"/>
			<stop offset="100%" stop-color="#0000ff"/>
		</linearGradient>

		<!-- Linear gradient với scale -->
		<linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="scale(2, 1)">
			<stop offset="0%" stop-color="#ffff00"/>
			<stop offset="100%" stop-color="#ff00ff"/>
		</linearGradient>

		<!-- Radial gradient với transform phức tạp -->
		<radialGradient id="grad4" cx="50%" cy="50%" r="50%" gradientTransform="translate(0.2, 0.2) scale(1.5, 0.8) rotate(30 0.5 0.5)">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="50%" stop-color="#00ffff"/>
			<stop offset="100%" stop-color="#0000ff"/>
		</radialGradient>

		<!-- Radial gradient với skewX -->
		<radialGradient id="grad5" cx="50%" cy="50%" r="50%" gradientTransform="skewX(30)">
			<stop offset="0%" stop-color="#ff6600"/>
			<stop offset="100%" stop-color="#ffcc00"/>
		</radialGradient>
	</defs>

	<text x="400" y="30" text-anchor="middle" font-size="24" fill="#333">Gradient Transform Demo</text>

	<!-- Row 1: Linear gradients -->
	<rect x="50" y="50" width="150" height="100" fill="url(#grad1)"/>
	<text x="125" y="165" text-anchor="middle" font-size="12">No Transform</text>

	<rect x="250" y="50" width="150" height="100" fill="url(#grad2)"/>
	<text x="325" y="165" text-anchor="middle" font-size="12">Rotate 45°</text>

	<rect x="450" y="50" width="150" height="100" fill="url(#grad3)"/>
	<text x="525" y="165" text-anchor="middle" font-size="12">Scale(2, 1)</text>

	<!-- Row 2: Radial gradients -->
	<circle cx="125" cy="280" r="75" fill="url(#grad4)"/>
	<text x="125" y="375" text-anchor="middle" font-size="12">Complex Transform</text>

	<ellipse cx="325" cy="280" rx="75" ry="60" fill="url(#grad5)"/>
	<text x="325" y="375" text-anchor="middle" font-size="12">SkewX(30)</text>

	<!-- Row 3: Path with gradient -->
	<path d="M 500 200 Q 575 220 600 280 Q 575 340 500 360 Q 425 340 400 280 Q 425 220 500 200 Z" fill="url(#grad4)"/>
	<text x="500" y="375" text-anchor="middle" font-size="12">Path with Transform</text>

	<!-- Info box -->
	<rect x="50" y="420" width="700" height="150" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
	<text x="400" y="445" text-anchor="middle" font-size="16" font-weight="bold">Gradient Transform Functions</text>
	<text x="70" y="470" font-size="12">• translate(x, y) - Di chuyển gradient</text>
	<text x="70" y="490" font-size="12">• rotate(angle [, cx, cy]) - Xoay gradient</text>
	<text x="70" y="510" font-size="12">• scale(sx [, sy]) - Co dãn gradient</text>
	<text x="70" y="530" font-size="12">• skewX(angle) / skewY(angle) - Nghiêng gradient</text>
	<text x="70" y="550" font-size="12">• matrix(a, b, c, d, e, f) - Transform tổng quát</text>
</svg>